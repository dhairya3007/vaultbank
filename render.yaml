# Render Blueprint deployment configuration
# Usage: Import repository on Render -> Blueprints -> render.yaml auto-detected
services:
  - type: web
    name: vaultbank
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_dummy_data
    startCommand: gunicorn locker_system.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4

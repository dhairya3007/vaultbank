{% extends 'lockers/base.html' %}
{% block title %}Report Dashboard{% endblock %}
{% block page_title %}Report Generator{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto; padding: 2rem;">
  <h2 style="font-size: 1.25rem; font-weight: 700; color: var(--text-main); margin: 0 0 1.5rem 0;">Generate Access Report</h2>
  
  <form action="{% url 'report_generate' %}" method="GET" target="_blank" x-data="{ period: 'weekly' }">
    <div style="margin-bottom: 1.5rem;">
      <label class="form-label" style="display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.875rem; color: var(--text-main);">Report Period</label>
      <select name="period" x-model="period" class="form-input" style="width: 100%; padding: 0.75rem; border-radius: var(--radius-md);">
        <option value="weekly">Last 7 Days (Weekly)</option>
        <option value="monthly">Last 30 Days (Monthly)</option>
        <option value="6_months">Last 6 Months</option>
        <option value="yearly">Last Year</option>
        <option value="all_time">All Time</option>
        <option value="custom">Custom Dates</option>
      </select>
    </div>

    <!-- Custom Date Range -->
    <div x-show="period === 'custom'" style="display: flex; gap: 1rem; margin-bottom: 1.5rem;" x-cloak>
      <div style="flex: 1;">
        <label class="form-label" style="display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.875rem; color: var(--text-main);">Start Date</label>
        <input type="date" name="start_date" class="form-input" style="width: 100%; padding: 0.75rem; border-radius: var(--radius-md);" :required="period === 'custom'">
      </div>
      <div style="flex: 1;">
        <label class="form-label" style="display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.875rem; color: var(--text-main);">End Date</label>
        <input type="date" name="end_date" class="form-input" style="width: 100%; padding: 0.75rem; border-radius: var(--radius-md);" :required="period === 'custom'">
      </div>
    </div>

    <div style="margin-bottom: 2rem;">
      <label class="form-label" style="display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.875rem; color: var(--text-main);">Filter by Locker</label>
      
      <style>
        .custom-select-item {
          padding: 0.625rem 1rem;
          cursor: pointer;
          font-size: 0.875rem;
          color: var(--text-main);
          transition: background-color 0.15s ease;
        }
        .custom-select-item:hover {
          background-color: #F1F5F9;
        }
        .custom-select-item.is-selected {
          background-color: #EFF6FF;
          color: #2563EB;
          font-weight: 600;
        }
      </style>

      <div x-data="{
        open: false,
        search: '',
        selectedId: 'all',
        selectedLabel: 'All Lockers',
        options: [
          {% for locker in lockers %}
          { id: '{{ locker.pk }}', label: 'Locker #{{ locker.locker_number|escapejs }}' },
          {% endfor %}
        ],
        get filteredOptions() {
          if (this.search.trim() === '') return this.options;
          const lowerSearch = this.search.toLowerCase();
          return this.options.filter(o => o.label.toLowerCase().includes(lowerSearch));
        },
        selectOption(id, label) {
          this.selectedId = id;
          this.selectedLabel = label;
          this.open = false;
          this.search = '';
        }
      }" style="position: relative;" @click.away="open = false">
        
        <!-- Hidden input for form submission -->
        <input type="hidden" name="locker_id" :value="selectedId">

        <!-- Dropdown trigger -->
        <button type="button" @click="open = !open; if(open) $nextTick(() => $refs.searchInput.focus())" class="form-input" style="width: 100%; padding: 0.75rem 1rem; border-radius: var(--radius-md); text-align: left; display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid var(--border-color); cursor: pointer; min-height: 48px;">
          <span x-text="selectedLabel"></span>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="color: var(--text-muted); transition: transform 0.2s;" :style="open ? 'transform: rotate(180deg);' : ''"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" /></svg>
        </button>

        <!-- Dropdown Menu -->
        <div x-show="open" x-transition.opacity.duration.200ms x-cloak style="position: absolute; z-index: 50; width: 100%; margin-top: 0.375rem; background: #fff; border: 1px solid var(--border-color); border-radius: var(--radius-md); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); overflow: hidden;">
          
          <!-- Search Input -->
          <div style="padding: 0.5rem; border-bottom: 1px solid var(--border-color); background: #F8FAFC;">
            <div style="position: relative;">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" /></svg>
              <input type="text" x-model="search" x-ref="searchInput" placeholder="Search lockers..." style="width: 100%; padding: 0.625rem 0.75rem 0.625rem 2.25rem; border: 1px solid #E2E8F0; border-radius: 0.375rem; font-size: 0.875rem; outline: none; background: #fff;">
            </div>
          </div>
          
          <!-- Options List -->
          <ul style="max-height: 260px; overflow-y: auto; padding: 0.25rem 0; margin: 0; list-style: none;">
            <!-- All Lockers Option -->
            <li @click="selectOption('all', 'All Lockers')" class="custom-select-item" :class="selectedId === 'all' ? 'is-selected' : ''">
              All Lockers
            </li>
            
            <!-- Dynamic Options -->
            <template x-for="option in filteredOptions" :key="option.id">
              <li @click="selectOption(option.id, option.label)" class="custom-select-item" :class="selectedId == option.id ? 'is-selected' : ''">
                <span x-text="option.label"></span>
              </li>
            </template>
            
            <!-- No results -->
            <li x-show="filteredOptions.length === 0" style="padding: 1rem; text-align: center; color: var(--text-muted); font-size: 0.875rem;">
              No lockers found matching "<span x-text="search" style="font-weight: 600;"></span>"
            </li>
          </ul>
        </div>
      </div>
    </div>

    <div style="display: flex; justify-content: flex-end;">
      <button type="submit" class="btn btn-primary" style="padding: 0.75rem 1.5rem; font-size: 1rem; font-weight: 600;">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="margin-right: 0.5rem;">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m.75 12 3 3m0 0 3-3m-3 3v-6m-1.5-9H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
        </svg>
        Generate Report
      </button>
    </div>
  </form>
</div>
{% endblock %}
